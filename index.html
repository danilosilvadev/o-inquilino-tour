<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>O Inquilino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="stage" class="stage-root"></div>

  <section id="gate" class="veil">
    <p class="gate-eyebrow">o inquilino</p>
    <h1 class="gate-ask">Você está<br /><em>em seu corpo?</em></h1>
    <div class="gate-choices">
      <button class="gate-btn" data-answer="sim">SIM</button>
      <button class="gate-btn" data-answer="nao">NÃO</button>
    </div>
    <p class="gate-reply" id="gateReply">&nbsp;</p>
  </section>

  <div id="chrome" class="hidden">
    <div class="hud tl"><span class="sub">um poema atravessado</span></div>
    <button class="hud bl sound" id="soundBtn"><span class="dot"></span><span id="soundLabel">SOM ON</span></button>
    <div class="hud br"><div class="rail" id="rail"><i id="railFill"></i></div></div>
    <div class="hud hint" id="hint">role para atravessar</div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
